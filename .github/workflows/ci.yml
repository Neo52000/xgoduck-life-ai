name: Life AI tests (no production secrets)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ADMIN_USER: test-admin
      ADMIN_PASSWORD: test-admin-password-example
      ROBOT_API_KEY: test-robot-api-key-123456789123456
      DATABASE_URL: sqlite:////tmp/lifeai_actions_import.sqlite3
      DATA_DIR: /tmp/lifeai_actions_import_media
      OPENAI_API_KEY: ''
      AUTO_VISION: 'false'
      REMOTE_REFERENCE_MATCHING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests offline
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q lifeai tools
