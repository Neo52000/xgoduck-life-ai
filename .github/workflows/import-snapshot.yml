name: Import V3.3 source snapshot
on:
  push:
    paths:
      - '.import/READY'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and restore archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, lzma, tarfile
          d=Path('.import')
          parts=sorted(d.glob('part-*.txt'))
          assert len(parts)==7, f'Expected 7 parts, got {len(parts)}'
          data=base64.b64decode(''.join(x.read_text().strip() for x in parts), validate=True)
          got=hashlib.sha256(data).hexdigest()
          expect=(d/'sha256.txt').read_text().strip()
          assert got==expect, 'SHA256 mismatch'
          archive=lzma.decompress(data)
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:') as t:
              for m in t.getmembers():
                  p=Path(m.name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert m.isfile()
              t.extractall('.',filter='data')
          PY
      - name: Commit restored project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .import
          rm -f .github/workflows/ci.yml
          git add -A
          git commit -m "feat: publish complete XGO-Duck Life AI V3.3 source [skip ci]"
          git push
