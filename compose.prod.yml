# Usage : docker compose -f compose.yml -f compose.prod.yml up -d --build
# Définir LIFEAI_DOMAIN et faire pointer son DNS vers l'IP du VPS.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      LIFEAI_DOMAIN: ${LIFEAI_DOMAIN:?Définir LIFEAI_DOMAIN dans .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
